form-origin:top left;background:white;padding:0;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) minmax(0,.2fr);grid-template-rows:minmax(0,1fr);gap:3mm;color:#000;font-family:"BiauKai","DFKai-SB","Noto Serif CJK TC","Microsoft JhengHei",serif;font-size:var(--type)}

solid #111;display:grid;grid-template-rows:var(--head-h) minmax(0,1fr);min-width:0}.answer-head{display:grid;grid-template-columns:1fr 1fr;line-height:1.4;text-align:center;border-bottom:.25mm solid #111;font-size:.94em}.answer-head>div{padding:1mm .4mm;overflow-wrap:anywhere}.answer-head>div+div{border-left:.2mm solid #111}.answer-columns{height:calc(var(--paper-h) - var(--head-h) - .5mm);display:grid;grid-template-columns:1fr 1fr;min-height:0}.answer-col{display:grid;grid-template-rows:repeat(10,minmax(0,1fr));min-height:0}.answer-col+div{border-left:.2mm solid #111}.answer{display:flex;flex-direction:column;align-items:center;justify-content:center;border-bottom:.2mm solid #111;line-height:1.45;font-family:"Times New Roman",serif}.answer:last-child{border-bottom:0}.answer b{font-weight:400;font-size:1.02em;white-space:nowrap}.radical{display:inline-flex;align-items:baseline}.radical .root-symbol{font-size:1.1em}.radical .radicand{border-top:.15mm solid #111;line-height:1;padding-top:.2mm}.empty-sheet{height:100%;border:.25mm dashed #b8b8b8;display:flex;align-items:center;justify-content:center;color:#888}.footer{font-size:13px;color:var(--muted);padding:25px 0 4px;text-align:center}.batch-summary{font-weight:700;color:var(--teal)}
@media(max-width:760px){.topbar{padding:20px;align-items:flex-start}.signature{display:none}h1{font-size:21px}.brand{gap:10px}.brand svg{width:38px}main{padding:16px}.control-top{padding:17px;gap:14px}.field.paper-field{width:100%}.field select{width:100%}.field.range-field{flex:1}.field input{width:100%;min-width:80px}.actions{margin:2px 0 0;width:100%}.actions button{flex:1;padding:11px 10px}.control-bottom{padding:12px 17px}.badge{display:none}.preview-heading p{line-height:1.6}.preview-heading{margin-top:22px}.page-label{font-size:12px}}
@media print{html,body{margin:0!important;padding:0!important;background:white!important}body{-webkit-print-color-adjust:exact;print-color-adjust:exact}.topbar,.controls,.preview-heading,.footer,.page-label{display:none!important}main{padding:0!important;margin:0!important;max-width:none!important}.pages{display:block!important}.page-block{margin:0!important;padding:0!important;break-after:page;page-break-after:always;break-inside:avoid;page-break-inside:avoid}.page-block:last-child{break-after:auto;page-break-after:auto}.paper-frame{width:var(--paper-w)!important;height:var(--paper-h)!important;box-shadow:none!important;outline:0!important;border-radius:0!important;overflow:hidden!important;margin:0 auto!important;break-inside:avoid!important;page-break-inside:avoid!important}.paper{position:relative!important;transform:none!important;grid-template-rows:minmax(0,1fr)!important}.empty-sheet{visibility:hidden}}
</style>

<body>
<header class="topbar"><div class="brand"><svg viewBox="0 0 48 48" fill="none" aria-hidden="true"><path d="M7 7V41H41Z" stroke="#ffb454" stroke-width="2"/><path d="M7 32H16V41" stroke="#d8edf1" stroke-width="2"/></svg><div><div class="eyebrow">ㄚ杰・無限出題器</div><h1>畢氏定理練習</h1></div></div><div class="signature">東興國中 鍾元杰老師<br>十道題型，每卷不同</div></header>
<main>
<section class="controls" aria-label="練習卷設定"><form id="settings"><div class="control-top">
<div class="field paper-field"><label for="paper-size">紙張大小</label><select id="paper-size"><option value="a4">A4 橫式・297 × 210 mm</option><option value="b4">B4 橫式・364 × 257 mm</option></select></div>
<div class="field range-field"><label for="start">起始卷號</label><input id="start" type="number" min="1" max="999999" step="1" value="1" required inputmode="numeric"></div><div class="range-separator" aria-hidden="true">—</div>
<div class="field range-field"><label for="end">結束卷號</label><input id="end" type="number" min="1" max="999999" step="1" value="2" required inputmode="numeric"></div>
<div class="actions"><button id="shuffle" type="button"><span class="button-icon" aria-hidden="true">⟳</span>換題目</button><button class="primary" type="submit">查看練習卷</button><button class="print-button" id="print" type="button">列印</button></div>
</div><div class="control-bottom"><div class="note">每張紙排兩份練習卷，右側附答案。換題後請以畫面上的新題目為準。</div><div id="status" role="status" aria-live="polite" class="batch-summary"></div></div></form></section>
<section aria-labelledby="preview-title"><div class="preview-heading"><div><h2 id="preview-title">練習卷預覽</h2><p>題型固定，邊長隨機變換，包含整數與化簡根式。查看後列印，題目與答案保持一致。</p></div><div class="badge" id="paper-badge">A4・橫式・每頁 2 卷</div></div><div id="pages" class="pages"></div></section>
<footer class="footer">列印設定：選擇相同紙張、橫向、縮放 100%，並關閉頁首與頁尾。也可選擇「另存為 PDF」。</footer>
</main>
<script id="app-code">
'use strict';
const PythagorasEngine=(()=>{
 const random=seed=>()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return ((t^t>>>14)>>>0)/4294967296;};
 const gcd=(a,b)=>b?gcd(b,a%b):a;
 function simplifyRoot(n){if(!Number.isSafeInteger(n)||n<=0)throw new Error('根號內須為正整數');let outside=1,inside=n;for(let k=2;k*k<=inside;k++)while(inside%(k*k)===0){outside*=k;inside/=k*k;}return inside===1?String(outside):(outside===1?'':outside)+'√'+inside;}
 const integerPool=[];for(let m=2;m<=14;m++)for(let n=1;n<m;n++)if(gcd(m,n)===1&&(m-n)%2===1){let a=m*m-n*n,b=2*m*n;if(a>b)[a,b]=[b,a];if(b/a>4)continue;for(let k=1;k<=25;k++)integerPool.push([a*k,b*k,(m*m+n*n)*k]);}integerPool.sort((x,y)=>x[2]-y[2]);
 const radicalHyp=[];for(let a=2;a<=50;a++)for(let b=a;b<=50;b++){const r=a*a+b*b;if(b/a<=4&&!Number.isInteger(Math.sqrt(r)))radicalHyp.push([a,b,Math.sqrt(r)]);}radicalHyp.sort((x,y)=>x[2]-y[2]);
 const radicalLeg=[];for(let c=5;c<=80;c++)for(let b=2;b<c;b++){const r=c*c-b*b;if(b/c>=.25&&Math.sqrt(r)/c>=.25&&!Number.isInteger(Math.sqrt(r)))radicalLeg.push([Math.sqrt(r),b,c]);}radicalLeg.sort((x,y)=>x[2]-y[2]);
 function generateBatch(start,end,seed){
 if(!Number.isSafeInteger(start)||!Number.isSafeInteger(end)||start<1||end<start||end>999999||end-start+1>500)throw new Error('請輸入 1～999999 的整數卷號，結束卷號不得小於起始卷號；每次最多 500 卷。');
 const rng=random(seed),pools=Array.from({length:10},(_,j)=>(j<5?integerPool:j<8?radicalHyp:radicalLeg).slice()),sheets=[];
 for(let n=start;n<=end;n++){const questions=[];for(let j=0;j<10;j++){const pool=pools[j],idx=Math.floor(rng()*Math.min(pool.length,j<5?30:150));let sides=pool.splice(idx,1)[0].slice();const missing=(j<4||(j>=5&&j<=7))?2:0;if(j<5&&rng()<.5)[sides[0],sides[1]]=[sides[1],sides[0]];const radicand=Math.round(sides[missing]**2),givens=sides.filter((_,i)=>i!==missing);questions.push({number:j+1,kind:missing===2?'求斜邊':'求另一股',sides,missing,givens,radicand,answer:simplifyRoot(radicand)});}sheets.push({number:n,questions});}return sheets;
 }
 function drawQuestion(q){
 const [a,b]=q.sides,angle=[15,-15,100,35,-20,-35,50,15,80,-15][q.number-1]*Math.PI/180;
 let pts=[{x:a,y:0},{x:0,y:0},{x:0,y:b}].map(p=>({x:p.x*Math.cos(angle)-p.y*Math.sin(angle),y:p.x*Math.sin(angle)+p.y*Math.cos(angle)}));
 const xs=pts.map(p=>p.x),ys=pts.map(p=>p.y),minX=Math.min(...xs),minY=Math.min(...ys),w=Math.max(...xs)-minX,h=Math.max(...ys)-minY,scale=Math.min(140/w,86/h);
 pts=pts.map(p=>({x:(p.x-minX)*scale+(220-w*scale)/2,y:(p.y-minY)*scale+(140-h*scale)/2}));
 const [A,B,C]=pts,cent={x:(A.x+B.x+C.x)/3,y:(A.y+B.y+C.y)/3},f=n=>Number(n.toFixed(2));
 const text=(p,t,size=17)=>`<text x="${f(p.x)}" y="${f(p.y)}" text-anchor="middle" dominant-baseline="middle" font-size="${size}" fill="#111" paint-order="stroke" stroke="white" stroke-width="3">${t}</text>`;
 const outward=(p,d)=>{const dx=p.x-cent.x,dy=p.y-cent.y,len=Math.hypot(dx,dy);return{x:p.x+d*dx/len,y:p.y+d*dy/len};};
 let parts=[`<path d="M ${f(A.x)} ${f(A.y)} L ${f(B.x)} ${f(B.y)} L ${f(C.x)} ${f(C.y)} Z" fill="none" stroke="#111" stroke-width="2"/>`];
 const u={x:(A.x-B.x)/Math.hypot(A.x-B.x,A.y-B.y),y:(A.y-B.y)/Math.hypot(A.x-B.x,A.y-B.y)},v={x:(C.x-B.x)/Math.hypot(C.x-B.x,C.y-B.y),y:(C.y-B.y)/Math.hypot(C.x-B.x,C.y-B.y)},r=7;
 parts.push(`<path d="M ${f(B.x+u.x*r)} ${f(B.y+u.y*r)} l ${f(v.x*r)} ${f(v.y*r)} l ${f(-u.x*r)} ${f(-u.y*r)}" fill="none" stroke="#111" stroke-width="1.4"/>`);
 [[B,A],[B,C],[C,A]].forEach(([p,t],i)=>{const mid={x:(p.x+t.x)/2,y:(p.y+t.y)/2};parts.push(text(outward(mid,13),i===q.missing?'x':String(q.sides[i])));});
 pts.forEach((p,i)=>parts.push(text(outward(p,13),'ABC'[i],15)));
 return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 140" role="img" aria-label="第 ${q.number} 題：直角在 B，${q.kind}，已知兩邊 ${q.givens.join('、')}，求 x"><g font-family="Times New Roman,serif">${parts.join('')}</g></svg>`;
 }
 return {generateBatch,simplifyRoot,drawQuestion};
})();
if(typeof globalThis!=='undefined')globalThis.PythagorasEngine=PythagorasEngine;
if(typeof document!=='undefined'){
 const $=id=>document.getElementById(id);let batch=[],seed=0,current=null;
 const makeSeed=()=>{const a=new Uint32Array(1);if(globalThis.crypto?.getRandomValues)crypto.getRandomValues(a);else a[0]=Math.random()*4294967296;return a[0];};
 function readSettings(){const start=Number($('start').value),end=Number($('end').value);if(!Number.isSafeInteger(start)||!Number.isSafeInteger(end)||start<1||end<start||end>999999||end-start+1>500)throw new Error('卷號須為正整數，結束卷號不得小於起始卷號；每次最多產生 500 卷。');return{start,end,paper:$('paper-size').value};}
 function sheetHTML(s){return `<article class="worksheet" aria-label="練習卷 ${s.number}"><header class="sheet-head"><div class="sheet-title"><h3>畢氏定理練習</h3><div class="serial">練習 ${s.number}</div><div class="credit">Powered by ㄚ杰・鍾元杰</div></div><div class="student"><div class="student-row"><div class="student-field"><span>班級：</span><span class="write-line"></span></div><div class="student-field"><span>座號：</span><span class="write-line"></span></div></div><div class="student-field student-name"><span>姓名：</span><span class="write-line"></span></div></div></header><div class="question-grid">${s.questions.map(q=>`<div class="question"><div class="question-title">${q.number}、直角<span class="triangle-symbol">△</span>ABC，求 x。</div>${PythagorasEngine.drawQuestion(q)}</div>`).join('')}</div></article>`;}
 function answerMarkup(s){const m=/^(\d*)√(\d+)$/.exec(s);return m?`${m[1]}<span class="radical"><span class="root-symbol">√</span><span class="radicand">${m[2]}</span></span>`:s;}
 function answerHTML(a,b){return `<aside class="answers" aria-label="答案"><div class="answer-head">${[a,b].map(s=>`<div>${s?'畢氏定理<br>答案<br>卷 '+s.number:''}</div>`).join('')}</div><div class="answer-columns">${[a,b].map(s=>`<div class="answer-col">${Array.from({length:10},(_,i)=>`<div class="answer">${s?`<span>(${i+1})</span><b>${answerMarkup(s.questions[i].answer)}</b>`:''}</div>`).join('')}</div>`).join('')}</div></aside>`;}
 function render(){
  const b4=current.paper==='b4';document.documentElement.style.setProperty('--paper-w',b4?'351mm':'284mm');document.documentElement.style.setProperty('--paper-h',b4?'243mm':'196mm');document.documentElement.style.setProperty('--head-h',b4?'27mm':'22mm');document.documentElement.style.setProperty('--type',b4?'3.4mm':'2.8mm');
  $('print-size').textContent=`@page{size:${b4?'364mm 257mm':'297mm 210mm'};margin:6mm}`;$('paper-badge').textContent=`${b4?'B4':'A4'}・橫式・每頁 2 卷`;
  const html=[];for(let i=0;i<batch.length;i+=2){const a=batch[i],b=batch[i+1];html.push(`<div class="page-block"><div class="page-label"><span>第 ${i/2+1} 頁 · 練習卷 ${a.number}${b?'、'+b.number:''}</span><span>${b4?'B4':'A4'} 橫式</span></div><div class="paper-frame"><div class="paper">${sheetHTML(a)}${b?sheetHTML(b):'<div class="empty-sheet">本頁僅一份練習卷</div>'}${answerHTML(a,b)}</div></div></div>`);}
  $('pages').innerHTML=html.join('');fit();$('status').className='batch-summary';$('status').textContent=`${batch.length} 份練習卷・${Math.ceil(batch.length/2)} 張紙`;
 }
 function fit(){document.querySelectorAll('.paper-frame').forEach(frame=>{const paper=frame.querySelector('.paper'),scale=frame.clientWidth/paper.offsetWidth;paper.style.transform=`scale(${scale})`;frame.style.height=(paper.offsetHeight*scale)+'px';});}
 function prepare(force=false){try{const next=readSettings();const rangeChanged=!current||next.start!==current.start||next.end!==current.end;if(force||rangeChanged){seed=makeSeed();batch=PythagorasEngine.generateBatch(next.start,next.end,seed);}current=next;render();return true;}catch(e){$('status').className='error';$('status').textContent=e.message;return false;}}
 $('settings').addEventListener('submit',e=>{e.preventDefault();prepare();});$('shuffle').addEventListener('click',()=>prepare(true));$('paper-size').addEventListener('change',()=>{if(current){current.paper=$('paper-size').value;render();}});
 $('print').addEventListener('click',()=>{if(prepare())requestAnimationFrame(()=>requestAnimationFrame(()=>window.print()));});window.addEventListener('resize',fit);window.addEventListener('afterprint',fit);
 prepare(true);
 globalThis.WorksheetApp={getBatch:()=>JSON.parse(JSON.stringify(batch)),prepare,readSettings};
 if(document.modelContext?.registerTool){try{document.modelContext.registerTool({name:'generate_pythagorean_worksheets',description:'依指定卷號範圍產生畢氏定理基礎練習練習卷，並回傳各卷十題的邊長與答案。',inputSchema:{type:'object',properties:{start:{type:'integer',minimum:1},end:{type:'integer',minimum:1},paper:{type:'string',enum:['a4','b4']}},required:['start','end']},execute:async({start,end,paper='a4'})=>{$('start').value=start;$('end').value=end;$('paper-size').value=paper;if(!prepare(true))return{content:[{type:'text',text:$('status').textContent}],isError:true};return{content:[{type:'text',text:JSON.stringify({sheets:batch,pages:Math.ceil(batch.length/2),paper})}]};}});}catch(e){console.warn('WebMCP unavailable',e);}}
}
</script>
